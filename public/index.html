<!-- BOOKING MODAL (نافذة الحجز) -->
<div id="bookingModal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 md:p-8 shadow-2xl relative text-right">
        <!-- Close Button -->
        <button onclick="closeBookingModal()" class="absolute top-4 left-4 text-stone-400 hover:text-stone-700 text-xl font-bold">
            ✕
        </button>

        <h3 class="text-2xl font-bold text-emerald-950 mb-1">طلب حجز إقامة</h3>
        <p class="text-xs font-mono text-stone-400 mb-6">Booking Form • Formulaire de Réservation</p>

        <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="space-y-4">
            <!-- Room Selection -->
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">اختر الغرفة / الجناح</label>
                <select id="bookRoom" required class="w-full border border-stone-300 rounded-lg p-2.5 text-sm bg-stone-50 focus:ring-2 focus:ring-emerald-700 outline-none">
                    <option value="جناح ديلوكس فاخر (859 DH)">جناح ديلوكس فاخر (859 DH / ليلة)</option>
                    <option value="غرفة مزدوجة تقليدية (859 DH)">غرفة مزدوجة تقليدية (859 DH / ليلة)</option>
                    <option value="جناح عائلي بلمسة مطلة (1200 DH)">جناح عائلي بلمسة مطلة (1,200 DH / ليلة)</option>
                    <option value="غرفة مريحة مطلة (859 DH)">غرفة مريحة مطلة (859 DH / ليلة)</option>
                </select>
            </div>

            <!-- Full Name -->
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">الاسم الكامل (Full Name)</label>
                <input type="text" id="bookName" placeholder="مثال: عمر الإدريسي" required class="w-full border border-stone-300 rounded-lg p-2.5 text-sm bg-stone-50 focus:ring-2 focus:ring-emerald-700 outline-none">
            </div>

            <!-- Phone Number -->
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">رقم الهاتف / الواتساب (Phone/WhatsApp)</label>
                <input type="tel" id="bookPhone" placeholder="06XXXXXXXX" required class="w-full border border-stone-300 rounded-lg p-2.5 text-sm bg-stone-50 focus:ring-2 focus:ring-emerald-700 outline-none">
            </div>

            <!-- Dates -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">تاريخ الوصول (Check-in)</label>
                    <input type="date" id="bookCheckIn" required class="w-full border border-stone-300 rounded-lg p-2.5 text-sm bg-stone-50 focus:ring-2 focus:ring-emerald-700 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">تاريخ المغادرة (Check-out)</label>
                    <input type="date" id="bookCheckOut" required class="w-full border border-stone-300 rounded-lg p-2.5 text-sm bg-stone-50 focus:ring-2 focus:ring-emerald-700 outline-none">
                </div>
            </div>

            <!-- Guests -->
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">عدد الأشخاص (Guests)</label>
                <input type="number" id="bookGuests" min="1" max="10" value="2" required class="w-full border border-stone-300 rounded-lg p-2.5 text-sm bg-stone-50 focus:ring-2 focus:ring-emerald-700 outline-none">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3.5 rounded-lg text-sm transition shadow-lg flex items-center justify-center gap-2 mt-4">
                <i class="fab fa-whatsapp text-lg"></i>
                إرسال الحجز عبر الواتساب | Confirm Booking
            </button>
        </form>
    </div>
</div>
